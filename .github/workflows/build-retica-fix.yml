name: Build patched Retica Rootless

on:
  push:
    branches:
      - retica-rootless-crashfix
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          set -euxo pipefail
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          brew install ldid xz || true

      - name: Install iOS SDK
        shell: bash
        run: |
          set -euxo pipefail
          export THEOS="$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          ls -la "$THEOS/sdks"

      - name: Build safety dylib
        shell: bash
        run: |
          set -euxo pipefail
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          find . -maxdepth 5 -type f -print

      - name: Download original Retica Rootless 1.0
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            https://ivintagelover.github.io/repo/pkg/com.ivintagelover.reticarl.deb \
            -o ReticaRootless-1.0-original.deb
          dpkg-deb -I ReticaRootless-1.0-original.deb

      - name: Merge crash fix into Retica
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf merged patch
          mkdir -p merged patch
          dpkg-deb -R ReticaRootless-1.0-original.deb merged

          PATCH_DEB="$(find packages -type f -name '*.deb' | head -1)"
          test -n "$PATCH_DEB"
          dpkg-deb -R "$PATCH_DEB" patch

          PATCH_DYLIB="$(find patch -type f -name 'ZZReticaCrashFix.dylib' | head -1)"
          PATCH_PLIST="$(find patch -type f -name 'ZZReticaCrashFix.plist' | head -1)"
          test -f "$PATCH_DYLIB"
          test -f "$PATCH_PLIST"

          TARGET_DIR="merged/var/jb/Library/MobileSubstrate/DynamicLibraries"
          mkdir -p "$TARGET_DIR"
          cp "$PATCH_DYLIB" "$TARGET_DIR/ZZReticaCrashFix.dylib"
          cp "$PATCH_PLIST" "$TARGET_DIR/ZZReticaCrashFix.plist"
          chmod 755 "$TARGET_DIR/ZZReticaCrashFix.dylib"
          chmod 644 "$TARGET_DIR/ZZReticaCrashFix.plist"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('merged/DEBIAN/control')
          text = p.read_text()
          lines = []
          for line in text.splitlines():
              if line.startswith('Version:'):
                  line = 'Version: 1.0.1-i5fix1'
              elif line.startswith('Name:'):
                  line = 'Name: Retica Rootless (Screen-Off Fix)'
              lines.append(line)
          p.write_text('\n'.join(lines) + '\n')
          PY

          dpkg-deb -b merged ReticaRootless-1.0.1-i5fix1.deb
          dpkg-deb -I ReticaRootless-1.0.1-i5fix1.deb
          shasum -a 256 ReticaRootless-1.0.1-i5fix1.deb

      - name: Upload patched DEB
        uses: actions/upload-artifact@v4
        with:
          name: ReticaRootless-1.0.1-i5fix1
          path: ReticaRootless-1.0.1-i5fix1.deb
          if-no-files-found: error
